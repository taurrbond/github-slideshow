name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Check HTML
        # node_modules ships vendored reveal.js demo/test pages with links we don't control
        run: bundle exec htmlproofer ./_site --disable-external --allow-missing-href --ignore-files "/node_modules/"
